<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MOGA</title>
<!--
  MOGA — a browser tool for photo-carousel / photo-sphere motion graphics.
  Original work. Only third-party runtime dependency: three.js (r0.160, MIT License).
  Timing curves, tile shader, layout math and default tuning are all implemented here
  from standard public techniques (cubic-bezier evaluation, Fibonacci-sphere point
  distribution, rounded-box SDF, IEC 61966-2-1 sRGB transfer).
-->
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0b0d; --panel: #141417; --panel-2: #1b1b1f; --line: #292930;
    --txt: #e8e8ec; --muted: #8a8a94; --on: #ffffff; --active: #34343d;
    --accent: #f2f2f4; --accent-ink: #0b0b0d; --stage: #000000;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--txt); overflow: hidden;
    font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  button { font: inherit; color: inherit; cursor: pointer; }

  #app { display: flex; height: calc(100% - 60px); }
  .col { width: 300px; padding: 16px; overflow-y: auto; flex-shrink: 0; scrollbar-width: none; -ms-overflow-style: none; }
  .col::-webkit-scrollbar { width: 0; height: 0; display: none; }
  #left { border-right: 1px solid var(--line); width: 360px; }
  #right { border-left: 1px solid var(--line); width: 320px; }

  .brand { display: flex; align-items: center; margin-bottom: 16px; }
  .brand svg { height: 19px; width: auto; display: block; }

  .toolbar { display: flex; gap: 6px; margin-bottom: 16px; }
  .toolbar button { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
    color: var(--txt); padding: 8px 10px; font-size: 12px; }
  .toolbar button:disabled { opacity: .35; cursor: default; }
  .toolbar button.grow { flex: 1; text-align: left; }

  .kicker { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 18px 0 9px; }
  .kicker.first { margin-top: 0; }
  .cap { font-size: 12px; color: var(--muted); margin: 14px 0 5px; }

  select.sel { width: 100%; background: var(--panel-2); color: var(--txt);
    border: 1px solid var(--line); border-radius: 9px; padding: 9px 10px; margin-top: 8px; }

  /* Lightroom-style collapsible sections */
  .sec { border-top: 1px solid var(--line); }
  .sec:first-of-type { border-top: 0; }
  .sec-head { display: flex; align-items: center; gap: 8px; padding: 11px 2px; cursor: pointer; user-select: none; }
  .sec-head .chev { color: var(--muted); font-size: 9px; width: 8px; text-align: center; transition: transform .15s; }
  .sec-head .nm { flex: 1; font-size: 14px; color: var(--txt); }
  .sec-head .eye { color: var(--muted); opacity: .4; font-size: 13px; pointer-events: none; }
  .sec.closed .chev { transform: rotate(-90deg); }
  .sec.closed .sec-body { display: none; }
  .sec-body { padding: 2px 0 14px; }

  .curve-box { margin-top: 8px; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px; touch-action: none; }
  .curve-box svg { display: block; width: 100%; height: auto; aspect-ratio: 1 / 1; overflow: visible; }
  .curve-path { fill: none; stroke: var(--txt); stroke-width: 2; stroke-linecap: round; }
  .curve-arm { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 1 3; stroke-linecap: round; opacity: .8; }
  .curve-anchor { fill: var(--muted); }
  .curve-handle { fill: var(--txt); stroke: var(--bg); stroke-width: 2; cursor: grab; }
  .curve-handle:active { cursor: grabbing; }

  .seg { display: flex; gap: 3px; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 3px; }
  .seg button { flex: 1; border: 0; background: transparent; color: var(--muted); padding: 7px 3px; border-radius: 6px; font-size: 13px; }
  .seg button.on { background: var(--active); color: var(--on); }

  /* Lightroom-style slider: label + value on top, thin track + round thumb below */
  .row { margin-top: 15px; }
  .row .row-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 5px; }
  .row label { color: var(--txt); font-size: 14px; }
  .row input[type=number] { width: 72px; background: transparent; border: 1px solid transparent;
    border-radius: 5px; padding: 1px 4px; color: var(--muted); text-align: right; font: inherit;
    font-size: 14px; font-variant-numeric: tabular-nums; outline: none; }
  .row input[type=number]:hover { color: var(--txt); }
  .row input[type=number]:focus { color: var(--txt); border-color: var(--line); background: var(--panel-2); }

  .row input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 15px;
    margin: 0; background: transparent; cursor: pointer; display: block; }
  .row input[type=range]::-webkit-slider-runnable-track { height: 2px; border-radius: 2px;
    background: linear-gradient(to right, #fff var(--fill, 0%), #4a4a53 var(--fill, 0%)); }
  .row input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px; margin-top: -6px; border-radius: 50%; background: #fff;
    box-shadow: 0 1px 3px rgba(0,0,0,.55); }
  .row input[type=range]::-moz-range-track { height: 2px; border-radius: 2px; background: #4a4a53; }
  .row input[type=range]::-moz-range-progress { height: 2px; border-radius: 2px; background: #fff; }
  .row input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border: 0; border-radius: 50%; background: #fff; }

  #stage { flex: 1; min-width: 0; display: grid; place-items: center; background: var(--stage); padding: 20px; }
  #stage .frame { position: relative; aspect-ratio: 16 / 9; max-width: 100%; max-height: 100%;
    background: #000; border-radius: 4px; overflow: hidden; box-shadow: 0 0 0 1px var(--line); }
  #view { display: block; width: 100%; height: 100%; }
  #rec { position: absolute; left: 12px; top: 12px; display: none; align-items: center; gap: 7px;
    font-size: 11px; letter-spacing: .1em; color: #ff7a7a; }
  #rec::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: #ff5b5b; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }

  .btn { width: 100%; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 9px; padding: 10px; color: var(--txt); margin: 4px 0 10px; }
  .btn.go { background: var(--accent); color: var(--accent-ink); border: 0; font-weight: 650; }
  .add-hint { color: var(--muted); font-size: 11px; line-height: 1.5; margin: -4px 2px 12px; }
  #right.drop { outline: 2px dashed var(--muted); outline-offset: -8px; }
  .meta { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 12px; margin: 8px 2px 12px; }
  .meta button { background: none; border: 0; color: var(--muted); font-size: 12px; cursor: pointer; }
  .meta button:hover { color: var(--txt); }
  #list { display: flex; flex-direction: column; gap: 2px; }
  .tile { display: flex; align-items: center; gap: 12px; padding: 8px 6px; border-radius: 8px; }
  .tile:hover { background: var(--panel-2); }
  .tile img { width: 34px; height: 42px; object-fit: cover; border-radius: 5px; background: var(--panel-2); flex-shrink: 0; }
  .tile .nm { flex: 1; font-size: 13px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .tile.hidden .nm, .tile.hidden img { opacity: .35; }
  .tile .acts { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
  .tile button { background: none; border: 0; color: var(--muted); width: 28px; height: 28px;
    display: grid; place-items: center; border-radius: 6px; cursor: pointer; }
  .tile button:hover { color: var(--txt); background: var(--line); }
  .tile button svg { display: block; }

  #bar { height: 60px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 16px; padding: 0 16px; }
  #pp { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--panel-2); display: grid; place-items: center; flex-shrink: 0; }
  #time { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; min-width: 96px; flex-shrink: 0; }
  #scrub { position: relative; flex: 1; height: 34px; cursor: pointer; }
  #scrub .rail { position: absolute; inset: 50% 0 auto 0; height: 3px; transform: translateY(-50%); background: var(--line); border-radius: 2px; }
  #scrub .done { position: absolute; left: 0; top: 50%; height: 3px; transform: translateY(-50%); background: var(--accent); border-radius: 2px; }
  #scrub .knob { position: absolute; top: 50%; width: 3px; height: 20px; transform: translate(-50%, -50%); background: var(--txt); border-radius: 2px; }
  #scrub .mk { position: absolute; top: 4px; font-size: 10px; color: var(--muted); transform: translateX(-50%); }
  #exp { position: relative; flex-shrink: 0; }
  #exp .btn { width: auto; margin: 0; padding: 9px 16px; display: flex; align-items: center; gap: 8px; }
  #menu { position: absolute; right: 0; bottom: 46px; min-width: 200px; display: none;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px; }
  #menu button { display: block; width: 100%; text-align: left; background: none; border: 0;
    padding: 9px 10px; border-radius: 7px; color: var(--txt); }
  #menu button:hover { background: var(--panel-2); }
  #menu .note { color: var(--muted); font-size: 11px; padding: 6px 10px 2px; }

  #gate { position: fixed; inset: 0; z-index: 999; background: var(--bg);
    display: flex; align-items: center; justify-content: center; }
  #gate .card { width: 340px; text-align: center; }
  #gate .brand { display: flex; justify-content: center; margin-bottom: 34px; }
  #gate .brand svg { height: 44px; width: auto; }
  #gate .field { display: flex; align-items: center; gap: 8px;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 16px; padding: 8px 8px 8px 16px; }
  #gate .field:focus-within { border-color: var(--muted); }
  #gate .field input { flex: 1; background: transparent; border: 0; outline: none;
    color: var(--txt); font: inherit; text-align: left; }
  #gate .field input::placeholder { color: var(--muted); }
  #gate .field button { flex-shrink: 0; width: 36px; height: 36px; border-radius: 10px; border: 0;
    background: var(--active); color: var(--txt); display: grid; place-items: center; cursor: pointer; }
  #gate .field button:hover { background: var(--accent); color: var(--accent-ink); }
  #gate .field button svg { display: block; }
  #gate .err { color: #ff7a7a; font-size: 12px; margin-top: 12px; min-height: 1em; }
</style>

<script>
  // Casual gate — deters browsing, not real security (password hash is public in this file).
  (function () {
    const HASH = "749ddb1b03f8a6d1d8f29d1a2b89d0685293f8ead5c28ec4211c222a126e8ba1";
    const gate = document.getElementById("gate");
    if (localStorage.getItem("mg-unlocked") === "1") { gate.remove(); return; }
    const pw = document.getElementById("gate-pw"), err = document.getElementById("gate-err");
    async function tryUnlock() {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(pw.value));
      const hex = [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
      if (hex === HASH) { localStorage.setItem("mg-unlocked", "1"); gate.remove(); }
      else { err.textContent = "Sai mật khẩu"; pw.value = ""; }
    }
    document.getElementById("gate-go").onclick = tryUnlock;
    pw.addEventListener("keydown", (e) => e.key === "Enter" && tryUnlock());
    pw.focus();
  })();
</script>

        draw();
      };
      const up = () => { removeEventListener("pointermove", move); removeEventListener("pointerup", up); onDragEnd?.(); };
      addEventListener("pointermove", move); addEventListener("pointerup", up);
    });
  }
  wire(h1, true); wire(h2, false);
  return draw;
}

/* ------------------------------------------------------------------ *
 *  Tile material — textured quad with an optional rounded-rect mask,
 *  a fade-to-background factor, an optional horizontal mirror, and a
 *  linear->display conversion (custom materials skip three's own).
 * ------------------------------------------------------------------ */
function tileMaterial() {
  return new THREE.ShaderMaterial({
    transparent: false,
    side: THREE.DoubleSide,
    uniforms: {
      uTex:     { value: null },
      uTexBack: { value: null },
      uUseBack: { value: 0 },
      uHasTex:  { value: 0 },
      uCorner:  { value: 0 },
      uRatio:   { value: 1 },
      uFade:    { value: 0 },
      uMirror:  { value: 0 },
      uBack:    { value: new THREE.Color(0, 0, 0) },
    },
    vertexShader: `
      varying vec2 vUv;
      void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
    `,
    fragmentShader: `
      precision highp float;
      uniform sampler2D uTex, uTexBack;
      uniform float uUseBack, uHasTex, uCorner, uRatio, uFade, uMirror;
      uniform vec3 uBack;
      varying vec2 vUv;

      float sdBox(vec2 pt, vec2 ext, float rad){
        vec2 q = abs(pt) - ext + rad;
        return min(max(q.x, q.y), 0.0) + length(max(q, 0.0)) - rad;
      }
      vec3 encode(vec3 c){
        return mix(c * 12.92, 1.055 * pow(c, vec3(0.41666)) - 0.055, step(0.0031308, c));
      }
      void main(){
        if (uCorner > 0.0005){
          vec2 pt  = vec2(vUv.x - 0.5, (vUv.y - 0.5) * uRatio);
          vec2 ext = vec2(0.5, uRatio * 0.5);
          if (sdBox(pt, ext, uCorner) > 0.0) discard;
        }
        // gl_FrontFacing tells us which side of the tile the camera is looking at.
        // Cards flip on a horizontal hinge (rotate about X), so the back face reads
        // top-for-bottom — correct that with a vertical flip, independent of uMirror.
        if (uHasTex < 0.5) {                      // no image yet — render a blank white tile
          gl_FragColor = vec4(mix(vec3(1.0), uBack, uFade), 1.0);
          return;
        }
        bool onBack = uUseBack > 0.5 && !gl_FrontFacing;
        vec2 uv = vec2(uMirror > 0.5 ? 1.0 - vUv.x : vUv.x, onBack ? 1.0 - vUv.y : vUv.y);
        vec4 texel = onBack ? texture2D(uTexBack, uv) : texture2D(uTex, uv);
        if (texel.a < 0.5) discard;
        gl_FragColor = vec4(mix(encode(texel.rgb), uBack, uFade), texel.a);
      }
    `,
  });
}

/* ------------------------------------------------------------------ *
 *  Engine
 *  stage -> pivot (fixed tilt) -> spinner (animated) -> tiles[]
 * ------------------------------------------------------------------ */
class Engine {
  constructor(canvas, cfg, sources) {
    this.cfg = { ...cfg };
    this.sources = sources.slice();
    this.tiles = [];
    this.quad = new THREE.PlaneGeometry(1, 1);
    this.tex = new Map();
    this.ratio = new Map();
    this._center = 0;
    this._p = new THREE.Vector3();
    this._q = new THREE.Quaternion();
    this._setCurve();

    this.gl = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, preserveDrawingBuffer: true });
    this.gl.setPixelRatio(1);
    this.gl.setSize(1920, 1080, false);
    this.gl.setClearColor(0x000000, 1);

    this.stage = new THREE.Scene();
    this.cam = new THREE.PerspectiveCamera(50, 16 / 9, 1, 5e5);
    this.cam.position.set(0, 0, this.cfg.dist);
    this.cam.lookAt(0, 0, 0);

    this.pivot = new THREE.Group();
    this.spinner = new THREE.Group();
    this.pivot.add(this.spinner);
    this.stage.add(this.pivot);

    this._load();
    this.build();
    this.tilt();
    this.lens();
  }

  _setCurve() { this.curve = makeCurve(...this.cfg.curve); }

  _load() {
    const L = new THREE.TextureLoader();
    for (const src of this.sources) {
      if (!src || this.tex.has(src)) continue;
      const t = L.load(src, (tx) => {
        const im = tx.image, w = im.naturalWidth || im.width, h = im.naturalHeight || im.height;
        if (w > 0) { this.ratio.set(src, h / w); this.lay(); }
      });
      t.colorSpace = THREE.SRGBColorSpace;
      t.anisotropy = this.gl.capabilities.getMaxAnisotropy();
      t.minFilter = THREE.LinearMipmapLinearFilter;
      t.generateMipmaps = true;
      this.tex.set(src, t);
    }
  }

  sources_(list) {
    const next = list.slice();
    for (const [k, t] of this.tex) if (!next.includes(k)) { t.dispose(); this.tex.delete(k); this.ratio.delete(k); }
    this.sources = next;
    this._load();
    this.build();
  }

  _src(i) {
    if (!this.sources.length) return "";
    const n = this.sources.length;
    return this.sources[((i % n) + n) % n];
  }

  // for two-sided cards, pair each tile with a different source halfway around the list
  _srcBack(i) {
    const n = this.sources.length;
    return n ? this._src(i + Math.floor(n / 2)) : "";
  }

  build() {
    const want = clamp(Math.round(this.cfg.count), 2, 400);
    while (this.tiles.length < want) {
      const m = new THREE.Mesh(this.quad, tileMaterial());
      this.spinner.add(m); this.tiles.push(m);
    }
    while (this.tiles.length > want) {
      const m = this.tiles.pop(); this.spinner.remove(m); m.material.dispose();
    }
    const twoSided = this.cfg.shape === "cardflip";
    for (let i = 0; i < this.tiles.length; i++) {
      const tx = this.tex.get(this._src(i)) || null;
      const u = this.tiles[i].material.uniforms;
      if (u.uTex.value !== tx) { u.uTex.value = tx; this.tiles[i].material.needsUpdate = true; }
      u.uHasTex.value = tx ? 1 : 0;
      u.uUseBack.value = twoSided ? 1 : 0;
      if (twoSided) {
        const bx = this.tex.get(this._srcBack(i)) || tx;
        if (u.uTexBack.value !== bx) { u.uTexBack.value = bx; this.tiles[i].material.needsUpdate = true; }
      }
    }
    this.lay();
  }

  lay() {
    const s = this.cfg.shape;
    if (s === "sphere") return this._laySphere();
    if (s === "flow") return this._layFlow(this._center);
    if (s === "grid") return this._layGrid();
    if (s === "cardflip") return this._layCardFlip(this._center);
    if (s === "ticker") return this._layTicker(this._center);
    if (s === "trail") return this._layTrail(this._center);
    if (s === "spiral") return this._laySpiral();
    if (s === "orbit") return this._layOrbitRings();
    if (s === "pinwheel") return this._layPinwheel();
    if (s === "radar") return this._layRadar();
    if (s === "kaleido") return this._layKaleido(this._center);
    if (s === "tunnel") return this._layTunnel(this._center);
    if (s === "bounce") return this._layBounce(this._center);
    if (s === "domino") return this._layDomino(this._center);
    if (s === "deck") return this._layDeck(this._center);
    if (s === "parallax") return this._layParallax(this._center);
    return this._layRing();
  }

  _layRing() {
    const c = this.cfg, n = this.tiles.length;
    if (!n) return;
    for (let i = 0; i < n; i++) {
      const tile = this.tiles[i];
      const a = (i / n) * TAU, s = Math.sin(a), k = Math.cos(a);
      if (c.axis === "z") { tile.position.set(s * c.ringRadius, k * c.ringRadius, 0); tile.rotation.set(0, 0, a); }
      else if (c.axis === "x") { tile.position.set(0, -s * c.ringRadius, k * c.ringRadius); tile.rotation.set(a, 0, 0); }
      else { tile.position.set(s * c.ringRadius, 0, k * c.ringRadius); tile.rotation.set(0, a, 0); }
      if (tile.geometry !== this.quad) tile.geometry = this.quad;
      this._fit(tile, i);
    }
  }

  _laySphere() {
    const c = this.cfg, n = this.tiles.length;
    if (!n) return;
    const rad = c.sphereRadius;
    const golden = Math.PI * (3 - Math.sqrt(5));
    const M = new THREE.Matrix4();
    const dir = new THREE.Vector3(), ex = new THREE.Vector3(), ey = new THREE.Vector3();
    const up = new THREE.Vector3(0, 1, 0), alt = new THREE.Vector3(1, 0, 0);
    for (let i = 0; i < n; i++) {
      const tile = this.tiles[i];
      const y = 1 - ((i + 0.5) / n) * 2;             // even bands from top to bottom
      const band = Math.sqrt(Math.max(0, 1 - y * y));
      const a = golden * i;                           // golden-angle spiral around the axis
      dir.set(Math.cos(a) * band, y, Math.sin(a) * band);
      tile.position.copy(dir).multiplyScalar(rad);
      if (c.face === "outward") {
        ex.crossVectors(up, dir);
        if (ex.lengthSq() < 1e-8) ex.crossVectors(alt, dir);
        ex.normalize(); ey.crossVectors(dir, ex);
        M.makeBasis(ex, ey, dir);
        tile.quaternion.setFromRotationMatrix(M);
      } else tile.rotation.set(0, 0, 0);
      if (tile.geometry !== this.quad) tile.geometry = this.quad;
      this._fit(tile, i);
    }
  }

  // Cover Flow: a line of tiles: the one nearest `center` sits flat and forward,
  // its neighbours pivot outward and recede — the classic iTunes-coverflow layout.
  _layFlow(center) {
    const c = this.cfg, n = this.tiles.length;
    if (!n) return;
    for (let i = 0; i < n; i++) {
      const tile = this.tiles[i];
      let off = i - center;
      off = ((off % n) + n) % n;
      if (off > n / 2) off -= n;                    // shortest signed distance around the loop
      const dir = Math.sign(off), mag = Math.abs(off), ramp = Math.min(mag, 1);
      tile.position.set(off * c.flowGap, 0, -ramp * c.flowDepth - Math.max(0, mag - 1) * c.flowDepth * 0.12);
      tile.rotation.set(0, dir * ramp * THREE.MathUtils.degToRad(c.flowAngle), 0);
      if (tile.geometry !== this.quad) tile.geometry = this.quad;
      this._fit(tile, i);
      tile.scale.multiplyScalar(1 - ramp * (1 - c.flowSideScale / 100));
    }
  }

  // Card Flip: a vertical rolodex stack. The card nearest `center` sits flat and
  // large; as it passes it rotates 180° on X, revealing a different paired image
  // on its back (handled by the shader's gl_FrontFacing test), then recedes.
  _layCardFlip(center) {
    const c = this.cfg, n = this.tiles.length;
    if (!n) return;
    for (let i = 0; i < n; i++) {
      const tile = this.tiles[i];
      let off = i - center;
      off = ((off % n) + n) % n;
      if (off > n / 2) off -= n;
      const dir = Math.sign(off), mag = Math.abs(off), ramp = Math.min(mag, 1);
      const eased = this.curve(ramp);
      tile.position.set(0, -off * c.flipGap, -eased * c.flipDepth - Math.max(0, mag - 1) * c.flipDepth * 0.2);
      tile.rotation.set(dir * eased * Math.PI, 0, 0);
      if (tile.geometry !== this.quad) tile.geometry = this.quad;
      this._fit(tile, i);
      tile.scale.multiplyScalar(1 + (1 - ramp) * (c.flipBump / 100 - 1));
    }
  }

  // Grid Reveal: a static grid; each tile fades/scales in on its own looping phase,
  // offset by its row+column so a wave sweeps across the wall.
  _layGrid() {
    const c = this.cfg, n = this.tiles.length;
    if (!n) return;
    const cols = Math.max(1, Math.round(Math.sqrt(n * 1.4)));
    const rows = Math.ceil(n / cols);
    const cellW = c.tileSize + c.gridGap, cellH = c.tileSize * 1.2 + c.gridGap;
    for (let i = 0; i < n; i++) {
      const tile = this.tiles[i];
      const row = Math.floor(i / cols), col = i % cols;
      tile.position.set((col - (cols - 1) / 2) * cellW, ((rows - 1) / 2 - row) * cellH, 0);
      tile.rotation.set(0, 0, 0);
      if (tile.geometry !== this.quad) tile.geometry = this.quad;
      this._fit(tile, i);
      tile.userData.gridPhase = (row + col) / Math.max(1, rows + cols - 2);
    }
  }

  // Ticker Loop: one band of tiles scrolling at constant speed, wrapping seamlessly.
  _layTicker(offset) {
    const c = this.cfg, n = this.tiles.length;
    if (!n) return;
    const gap = c.tileSize + c.tickerGap, band = gap * n;
    for (let i = 0; i < n; i++) {
      const tile = this.tiles[i];
      const pos = ((i * gap - offset) % band + band) % band - band / 2;
      if (c.axis === "y") tile.position.set(0, pos, 0); else tile.position.set(pos, 0, 0);
      tile.rotation.set(0, 0, 0);
      if (tile.geometry !== this.quad) tile.geometry = this.quad;
      this._fit(tile, i);
      tile.material.uniforms.uFade.value = 0;
    }
  }

  // Image Trail: a comet — tile 0 leads at full size/brightness, later tiles trail
  // behind along the same wave path, shrinking and fading toward the tail.
  _layTrail(progress) {
    const c = this.cfg, n = this.tiles.length;
    if (!n) return;
    for (let i = 0; i < n; i++) {
      const tile = this.tiles[i];
      const s = (((i / n) + progress) % 1 + 1) % 1;
      const head = 1 - i / n;
      tile.position.set((s - 0.5) * c.trailWidth, Math.sin(s * Math.PI * 2 * c.trailWaves) * c.trailHeight, 0);
      tile.rotation.set(0, 0, 0);
      if (tile.geometry !== this.quad) tile.geometry = this.quad;
      this._fit(tile, i);
      tile.scale.multiplyScalar(0.35 + 0.65 * head);
      tile.material.uniforms.uFade.value = 1 - head;
    }
  }

  // Spiral Helix: tiles climb a helix, radius growing with height — a static shape
  // spun as a whole by the shared rotate-the-group path (like Ring/Sphere).
  _laySpiral() {
    const c = this.cfg, n = this.tiles.length;
    if (!n) return;
    for (let i = 0; i < n; i++) {
      const tile = this.tiles[i];
      const s = n > 1 ? i / (n - 1) : 0;
      const a = s * Math.PI * 2 * c.spiralTurns;
      const r = c.spiralRadius * (0.35 + 0.65 * s);
      tile.position.set(Math.sin(a) * r, (s - 0.5) * c.spiralHeight, Math.cos(a) * r);
      tile.rotation.set(0, a, 0);
      if (tile.geometry !== this.quad) tile.geometry = this.quad;
      this._fit(tile, i);
    }
  }

  // Orbit Rings: 3 concentric rings at different heights — also spun as a whole.
  _layOrbitRings() {
    const c = this.cfg, n = this.tiles.length, rings = 3;
    if (!n) return;
    const per = Math.ceil(n / rings);
    for (let i = 0; i < n; i++) {
      const tile = this.tiles[i];
      const ring = Math.floor(i / per), within = i % per;
      const countIn = Math.min(per, n - ring * per);
      const a = (within / Math.max(1, countIn)) * Math.PI * 2;
      const r = c.orbitBaseRadius + ring * c.orbitRingGap;
      tile.position.set(Math.sin(a) * r, (ring - (rings - 1) / 2) * c.orbitRingSpread, Math.cos(a) * r);
      tile.rotation.set(0, a, 0);
      if (tile.geometry !== this.quad) tile.geometry = this.quad;
      this._fit(tile, i);
    }
  }

  // Pinwheel: a flat fan of tiles facing the camera, spun around Z like a windmill.
  _layPinwheel() {
    const c = this.cfg, n = this.tiles.length;
    if (!n) return;
    for (let i = 0; i < n; i++) {
      const tile = this.tiles[i];
      const a = (i / n) * Math.PI * 2;
      tile.position.set(Math.cos(a) * c.pinwheelRadius, Math.sin(a) * c.pinwheelRadius, 0);
      tile.rotation.set(0, 0, a + Math.PI / 2);
      if (tile.geometry !== this.quad) tile.geometry = this.quad;
      this._fit(tile, i);
    }
  }

  // Radar Sweep: a static ring (billboarded to the camera); a highlight independent
  // of the ring's own slow drift sweeps around, brightening tiles as it passes.
  _layRadar() {
    const c = this.cfg, n = this.tiles.length;
    if (!n) return;
    for (let i = 0; i < n; i++) {
      const tile = this.tiles[i];
      const a = (i / n) * Math.PI * 2;
      tile.position.set(Math.cos(a) * c.radarRadius, Math.sin(a) * c.radarRadius, 0);
      tile.rotation.set(0, 0, 0);
      if (tile.geometry !== this.quad) tile.geometry = this.quad;
      this._fit(tile, i);
      tile.userData.radarAngle = a;
    }
  }

  _radarSweep(time) {
    const c = this.cfg;
    const sweep = ((time / Math.max(0.5, c.radarPeriod)) % 1) * Math.PI * 2 * c.direction;
    const spin = this.spinner.rotation.z;
    for (const tile of this.tiles) {
      let d = (tile.userData.radarAngle + spin - sweep) % (Math.PI * 2);
      if (d > Math.PI) d -= Math.PI * 2; else if (d < -Math.PI) d += Math.PI * 2;
      const near = Math.max(0, 1 - Math.abs(d) / Math.max(0.05, c.radarWidth));
      tile.scale.multiplyScalar(1 + near * (c.radarBoost / 100 - 1));
      const u = tile.material.uniforms;
      u.uFade.value = Math.max(0, u.uFade.value - near * 0.7);
    }
  }

  // Kaleidoscope Burst: tiles at fixed angular slots, radius breathing in and out.
  _layKaleido(time) {
    const c = this.cfg, n = this.tiles.length;
    if (!n) return;
    const breathe = 0.5 + 0.5 * Math.sin((time / Math.max(0.5, c.loop)) * Math.PI * 2);
    const r = c.kaleidoMinRadius + (c.kaleidoMaxRadius - c.kaleidoMinRadius) * this.curve(breathe);
    const spin = time * 0.2 * c.direction;
    for (let i = 0; i < n; i++) {
      const tile = this.tiles[i];
      const a = (i / n) * Math.PI * 2 + spin;
      tile.position.set(Math.sin(a) * r, Math.cos(a) * r, 0);
      tile.rotation.set(0, 0, a);
      if (tile.geometry !== this.quad) tile.geometry = this.quad;
      this._fit(tile, i);
      tile.material.uniforms.uFade.value = 0;
    }
  }

  // Zoom Tunnel: tiles fly from far/small/dim to near/large/bright and loop.
  _layTunnel(progress) {
    const c = this.cfg, n = this.tiles.length;
    if (!n) return;
    const golden = 2.399963;
    for (let i = 0; i < n; i++) {
      const tile = this.tiles[i];
      const s = (((i / n) + progress) % 1 + 1) % 1;
      const ang = (i * golden) % (Math.PI * 2);
      tile.position.set(Math.cos(ang) * c.tunnelSpread, Math.sin(ang) * c.tunnelSpread, -c.tunnelDepth * (1 - s));
      tile.rotation.set(0, 0, 0);
      if (tile.geometry !== this.quad) tile.geometry = this.quad;
      this._fit(tile, i);
      tile.scale.multiplyScalar(0.1 + 0.9 * s);
      tile.material.uniforms.uFade.value = Math.max(0, 1 - s * 1.4);
    }
  }

  // Bounce Grid: a static grid where a traveling wave bounces each column in turn.
  _layBounce(time) {
    const c = this.cfg, n = this.tiles.length;
    if (!n) return;
    const cols = Math.max(1, Math.round(Math.sqrt(n * 1.4)));
    const rows = Math.ceil(n / cols);
    const cellW = c.tileSize + c.bounceGap, cellH = c.tileSize * 1.2 + c.bounceGap;
    for (let i = 0; i < n; i++) {
      const tile = this.tiles[i];
      const row = Math.floor(i / cols), col = i % cols;
      const phase = col / Math.max(1, cols - 1);
      const bounce = Math.max(0, Math.sin((time / Math.max(0.3, c.loop) - phase * c.bounceStagger) * Math.PI * 2));
      tile.position.set((col - (cols - 1) / 2) * cellW, ((rows - 1) / 2 - row) * cellH + bounce * c.bounceHeight, 0);
      tile.rotation.set(0, 0, 0);
      if (tile.geometry !== this.quad) tile.geometry = this.quad;
      this._fit(tile, i);
      tile.scale.multiplyScalar(1 + bounce * 0.15);
      tile.material.uniforms.uFade.value = 0;
    }
  }

  // Domino Cascade: a row of tiles standing on a baseline; a wave sweeps down the
  // row, tipping each one on its bottom edge like a falling domino, then it rights.
  _layDomino(time) {
    const c = this.cfg, n = this.tiles.length;
    if (!n) return;
    const cellW = c.tileSize + c.dominoGap;
    const wave = (time / Math.max(0.5, c.loop)) * n * c.direction;
    for (let i = 0; i < n; i++) {
      const tile = this.tiles[i];
      let d = i - wave;
      d = ((d % n) + n) % n; if (d > n / 2) d -= n;
      const fall = Math.max(0, 1 - Math.abs(d));
      const theta = this.curve(fall) * THREE.MathUtils.degToRad(c.dominoAngle);
      const x0 = (i - (n - 1) / 2) * cellW;
      tile.position.set(x0 + Math.sin(theta) * c.tileSize / 2, Math.cos(theta) * c.tileSize / 2, 0);
      tile.rotation.set(0, 0, -theta);
      if (tile.geometry !== this.quad) tile.geometry = this.quad;
      this._fit(tile, i);
      tile.material.uniforms.uFade.value = 0;
    }
  }

  // Deck Shuffle: a stack riffling — the top card cycles back to the bottom, with
  // a slight fan offset per depth so the whole deck reads as a stack, not one card.
  _layDeck(center) {
    const c = this.cfg, n = this.tiles.length;
    if (!n) return;
    for (let i = 0; i < n; i++) {
      const tile = this.tiles[i];
      let off = i - center;
      off = ((off % n) + n) % n;
      tile.position.set(off * c.deckOffsetX, -off * c.deckOffsetY, -off * c.deckDepth);
      if (tile.geometry !== this.quad) tile.geometry = this.quad;
      this._fit(tile, i);
      tile.rotation.set(0, 0, THREE.MathUtils.degToRad(c.deckFan) * (off % 2 ? -1 : 1) * Math.min(1, off));
    }
  }

  // Parallax Drift: 3 depth layers scroll sideways at different speeds — nearer,
  // sharper, faster; farther, smaller, dimmer.
  _layParallax(offset) {
    const c = this.cfg, n = this.tiles.length, layers = 3;
    if (!n) return;
    const per = Math.ceil(n / layers);
    for (let i = 0; i < n; i++) {
      const tile = this.tiles[i];
      const layer = i % layers, idx = Math.floor(i / layers);
      const gap = c.tileSize * (1 + layer * 0.35) + c.parallaxGap;
      const band = gap * Math.max(1, per);
      const x = ((idx * gap - offset * (1 + layer * c.parallaxSpeedStep)) % band + band) % band - band / 2;
      tile.position.set(x, (layer - 1) * c.parallaxRowGap, -layer * c.parallaxDepth);
      tile.rotation.set(0, 0, 0);
      if (tile.geometry !== this.quad) tile.geometry = this.quad;
      this._fit(tile, i);
      tile.scale.multiplyScalar(1 - layer * 0.15);
      tile.material.uniforms.uFade.value = layer * 0.3;
    }
  }

  _fit(tile, i) {
    const c = this.cfg;
    const r = this.ratio.get(this._src(i)) ?? 1.25;
    tile.scale.set(c.tileSize, c.tileSize * r, 1);
    const u = tile.material.uniforms;
    u.uCorner.value = c.tileSize > 0 ? Math.min(0.5, Math.max(0, c.corner) / c.tileSize) : 0;
    u.uRatio.value = r;
    u.uMirror.value = c.mirror ? 1 : 0;
  }

  tilt() {
    const c = this.cfg;
    this.pivot.rotation.set(
      THREE.MathUtils.degToRad(c.tiltX || 0),
      THREE.MathUtils.degToRad(c.tiltY || 0),
      THREE.MathUtils.degToRad(c.tiltZ || 0),
    );
  }

  lens() {
    const zoom = Math.max(0.05, this.cfg.lens / 100);
    this.cam.fov = THREE.MathUtils.radToDeg(2 * Math.atan(540 / (1000 / zoom)));
    this.cam.position.set(0, 0, this.cfg.dist);
    this.cam.lookAt(0, 0, 0);
    this.cam.updateProjectionMatrix();
  }

  tick(time) {
    const c = this.cfg, n = Math.max(1, this.tiles.length);
    for (const t of this.tiles) t.visible = true;

    if (c.shape === "flow" || c.shape === "cardflip") {
      this.spinner.rotation.set(0, 0, 0);
      const stepDur = c.loop / n, hold = Math.max(0, c.hold || 0), slot = stepDur + hold;
      const step = Math.floor(time / slot);
      const into = sat((time - step * slot) / stepDur);
      this._center = (step + this.curve(into)) * c.direction;
      if (c.shape === "flow") this._layFlow(this._center); else this._layCardFlip(this._center);
      this._fade();
      return;
    }
    if (c.shape === "grid") {
      this.spinner.rotation.set(0, 0, 0);
      const cycle = time / Math.max(0.5, c.loop);
      for (const tile of this.tiles) {
        const local = (((cycle + (tile.userData.gridPhase || 0) * c.gridStagger) % 1) + 1) % 1;
        const e = this.curve(1 - Math.abs(local * 2 - 1));
        const u = tile.material.uniforms;
        u.uFade.value = 1 - e; u.uBack.value.set(0, 0, 0);
        const s = 0.55 + 0.45 * e, r = u.uRatio.value;
        tile.scale.set(c.tileSize * s, c.tileSize * r * s, 1);
      }
      return;
    }
    if (c.shape === "ticker") {
      this.spinner.rotation.set(0, 0, 0);
      const speed = (c.tileSize + c.tickerGap) / Math.max(0.5, c.loop) * n;
      this._center = time * speed * c.direction;
      this._layTicker(this._center);
      return;
    }
    if (c.shape === "trail") {
      this.spinner.rotation.set(0, 0, 0);
      const revs = time / Math.max(0.5, c.loop);
      const whole = Math.floor(revs);
      this._center = (whole + this.curve(revs - whole)) * c.direction;
      this._layTrail(this._center);
      return;
    }
    if (c.shape === "kaleido") {
      this.spinner.rotation.set(0, 0, 0);
      this._center = time;
      this._layKaleido(time);
      return;
    }
    if (c.shape === "tunnel") {
      this.spinner.rotation.set(0, 0, 0);
      this._center = (time / Math.max(0.5, c.loop)) * c.direction;
      this._layTunnel(this._center);
      return;
    }
    if (c.shape === "bounce") {
      this.spinner.rotation.set(0, 0, 0);
      this._center = time;
      this._layBounce(time);
      return;
    }
    if (c.shape === "domino") {
      this.spinner.rotation.set(0, 0, 0);
      this._center = time;
      this._layDomino(time);
      return;
    }
    if (c.shape === "deck") {
      this.spinner.rotation.set(0, 0, 0);
      const stepDur = c.loop / n, hold = Math.max(0, c.hold || 0), slot = stepDur + hold;
      const step = Math.floor(time / slot);
      const into = sat((time - step * slot) / stepDur);
      this._center = (step + this.curve(into)) * c.direction;
      this._layDeck(this._center);
      this._fade();
      return;
    }
    if (c.shape === "parallax") {
      this.spinner.rotation.set(0, 0, 0);
      const speed = (c.tileSize + c.parallaxGap) / Math.max(0.5, c.loop);
      this._center = time * speed * c.direction;
      this._layParallax(this._center);
      return;
    }

    let angle;
    if (c.mode === "steps") {
      const moves = Math.max(1, c.cycles || 1);
      const moveDur = c.loop / (n * moves);
      const slot = moveDur + Math.max(0, c.hold);
      const step = Math.floor(time / slot);
      const into = sat((time - step * slot) / moveDur);
      angle = (step + this.curve(into)) * (TAU / n);
    } else {
      const revs = time / Math.max(0.5, c.loop);
      const whole = Math.floor(revs);
      angle = (whole + this.curve(revs - whole)) * ((c.sweep ?? 360) * Math.PI / 180);
    }
    angle *= c.direction;

    if (c.axis === "z") this.spinner.rotation.set(0, 0, angle);
    else if (c.axis === "x") this.spinner.rotation.set(-angle, 0, 0);
    else this.spinner.rotation.set(0, angle, 0);

    this._fade();
    if (c.face === "camera") this._billboard();
    if (c.shape === "sphere") this._sphereScale();
    if (c.shape === "ring" && !c.showBacks) this._cullBacks();
    if (c.shape === "radar") this._radarSweep(time);
  }

  _fade() {
    const strength = sat(this.cfg.fade / 100);
    const camZ = this.cam.position.z;
    if (strength <= 0) { for (const t of this.tiles) t.material.uniforms.uFade.value = 0; return; }
    this.stage.updateMatrixWorld(true);
    let lo = Infinity, hi = -Infinity;
    for (const t of this.tiles) { t.getWorldPosition(this._p); const d = Math.abs(camZ - this._p.z); if (d < lo) lo = d; if (d > hi) hi = d; }
    const span = Math.max(1, hi - lo);
    for (const t of this.tiles) {
      t.getWorldPosition(this._p);
      const k = (Math.abs(camZ - this._p.z) - lo) / span;
      t.material.uniforms.uFade.value = k * k * (3 - 2 * k) * strength;   // smoothstep
    }
  }

  _billboard() {
    this.stage.updateMatrixWorld(true);
    for (const t of this.tiles) {
      if (!t.parent) continue;
      t.parent.getWorldQuaternion(this._q);
      t.quaternion.copy(this._q).invert();
    }
  }

  _sphereScale() {
    const c = this.cfg;
    this.stage.updateMatrixWorld(true);
    const R = Math.max(1, c.sphereRadius), camZ = this.cam.position.z;
    const back = c.backScale / 100, front = c.frontScale / 100;
    for (const t of this.tiles) {
      t.getWorldPosition(this._p);
      const depth = sat((this._p.z / R + 1) / 2);              // 0 = far side, 1 = near side
      const s = mix(back, front, depth);
      const gain = camZ / Math.max(1, camZ - this._p.z);        // 1/z foreshortening
      const r = t.material.uniforms.uRatio.value;
      t.scale.set(c.tileSize * s * gain, c.tileSize * r * s * gain, 1);
    }
  }

  _cullBacks() {
    this.stage.updateMatrixWorld(true);
    const nrm = new THREE.Vector3(), pos = new THREE.Vector3(), toCam = new THREE.Vector3();
    for (const t of this.tiles) {
      t.getWorldQuaternion(this._q);
      nrm.set(0, 0, 1).applyQuaternion(this._q);
      t.getWorldPosition(pos);
      toCam.subVectors(this.cam.position, pos).normalize();
      if (nrm.dot(toCam) <= 0) t.visible = false;
    }
  }

  preset(cfg) {
    this.cfg = { ...cfg };
    this._setCurve();
    this.build(); this.tilt(); this.lens();
  }

  patch(cfg) {
    const was = this.cfg;
    this.cfg = { ...cfg };
    this._setCurve();
    if (Math.round(cfg.count) !== Math.round(was.count)) this.build();
    else this.lay();
    this.tilt(); this.lens();
  }

  paint() { this.gl.render(this.stage, this.cam); }
}

 *  App
 * ------------------------------------------------------------------ */
const SPAN = 10;
let images = [];                                  // no images until the user adds some — tiles render blank white
const live = () => images.filter(x => x.on).map(x => x.url);

let preset = PRESETS[0];
let CFG = { ...preset.cfg };
const engine = new Engine(document.getElementById("view"), CFG, live());

/* ---- edit history: Reset restores the preset's defaults, Back/Next step through edits ---- */
const snapshot = () => ({ id: preset.id, cfg: { ...CFG, curve: CFG.curve.slice() } });
let history = [snapshot()], histAt = 0;
function pushHistory() {
  history = history.slice(0, histAt + 1);
  history.push(snapshot());
  if (history.length > 50) history.shift(); else histAt++;
  histAt = history.length - 1;
  syncHistory();
}
function goHistory(dir) {
  const at = histAt + dir;
  if (at < 0 || at >= history.length) return;
  histAt = at;
  const st = history[histAt];
  preset = PRESETS.find((p) => p.id === st.id);
  CFG = { ...st.cfg, curve: st.cfg.curve.slice() };
  engine.preset(CFG);
  buildPanel();
}
function resetPreset() {
  CFG = { ...preset.cfg, curve: preset.cfg.curve.slice() };
  engine.preset(CFG);
  buildPanel();
  pushHistory();
}
function syncHistory() {
  const back = document.getElementById("tb-back"), next = document.getElementById("tb-next");
  if (back) back.disabled = histAt <= 0;
  if (next) next.disabled = histAt >= history.length - 1;
}

let playing = true, head = 0, anchor = performance.now();
let recording = false, rec = null, blobs = [], loopsSeen = 0, scrubbing = false;

function setHead(t) { head = t; anchor = performance.now() - t * 1000; }
function play(on) {
  playing = on ?? !playing;
  if (playing) anchor = performance.now() - head * 1000;
  pp.textContent = playing ? "⏸" : "▶";
}

function loop() {
  requestAnimationFrame(loop);
  const now = performance.now();
  if (playing && !scrubbing) {
    const raw = (now - anchor) / 1000;
    if (recording && Math.floor(raw / SPAN) > loopsSeen) { loopsSeen = Math.floor(raw / SPAN); stopRec(); }
    head = raw % SPAN;
  }
  engine.tick(head);
  engine.paint();
  const r = head / SPAN;
  done.style.width = knob.style.left = (r * 100) + "%";
  const mmss = (n) => `${Math.floor(n / 60)}:${String(Math.floor(n % 60)).padStart(2, "0")}`;
  timeEl.textContent = `${mmss(head)} / ${mmss(SPAN)}`;
}

/* ---- left panel ---- */
const left = document.getElementById("left");
const countEl = document.getElementById("count");
const refreshCount = () => { countEl.textContent = `${images.length}/${Math.round(CFG.count || 0)} ảnh`; };
const shown = (v, step) => step < 1 ? Number(v).toFixed(2) : String(Math.round(v));
const fillTrack = (rng) => {
  const p = (rng.value - rng.min) / (rng.max - rng.min || 1) * 100;
  rng.style.setProperty("--fill", p + "%");
};

function apply(key, val) {
  CFG[key] = val;
  engine.patch(CFG);
  for (const inp of left.querySelectorAll(`[data-key="${key}"]`)) {
    if (inp.type === "number") inp.value = shown(val, inp.dataset.step);
    else { inp.value = val; fillTrack(inp); }
  }
  if (key === "count") refreshCount();
}

function buildPanel() {
  left.innerHTML = `<div class="brand">${MOGA_SVG}</div>
    <div class="toolbar">
      <button id="tb-reset" class="grow" title="Đưa motion về thông số mặc định">↺ Đặt lại</button>
      <button id="tb-back" title="Hoàn tác bước vừa rồi">◀</button>
      <button id="tb-next" title="Làm lại">▶</button>
    </div>
    <div class="kicker first">Kiểu chuyển động</div>`;
  document.getElementById("tb-reset").onclick = resetPreset;
  document.getElementById("tb-back").onclick = () => goHistory(-1);
  document.getElementById("tb-next").onclick = () => goHistory(1);
  const sel = document.createElement("select");
  sel.className = "sel";
  for (const p of PRESETS) {
    const o = document.createElement("option");
    o.value = p.id; o.textContent = vnLabel(p.label);
    if (p.id === preset.id) o.selected = true;
    sel.appendChild(o);
  }
  sel.onchange = () => {
    preset = PRESETS.find(p => p.id === sel.value);
    CFG = { ...preset.cfg };
    engine.preset(CFG);
    setHead(0);
    collapseRest();   // switching motion → tidy up (collapse all but the pinned section)
    buildPanel();
    pushHistory();
  };
  left.appendChild(sel);

  const numRow = (target, d) => {
    const row = document.createElement("div"); row.className = "row";
    const top = document.createElement("div"); top.className = "row-top";
    const lab = document.createElement("label"); lab.textContent = vnLabel(d.label); lab.title = HINT_OF(d.key);
    const num = document.createElement("input");
    num.type = "number"; num.min = d.min; num.max = d.max; num.step = d.step;
    num.value = shown(CFG[d.key], d.step); num.dataset.key = d.key; num.dataset.step = d.step;
    top.append(lab, num);
    const rng = document.createElement("input");
    rng.type = "range"; rng.min = d.min; rng.max = d.max; rng.step = d.step;
    rng.value = CFG[d.key]; rng.dataset.key = d.key; fillTrack(rng);
    rng.oninput = () => { apply(d.key, parseFloat(rng.value)); fillTrack(rng); };
    rng.onchange = () => pushHistory();
    num.onchange = () => { apply(d.key, clamp(parseFloat(num.value) || d.min, d.min, d.max)); pushHistory(); };
    row.append(top, rng);
    target.appendChild(row);
  };

  const renderField = (f, target) => {
    if (f.t === "seg") {
      const cap = document.createElement("div"); cap.className = "cap"; cap.textContent = vnLabel(f.label);
      cap.title = HINT_OF(f.key);
      target.appendChild(cap);
      const seg = document.createElement("div"); seg.className = "seg";
      for (const [val, txt] of f.opts) {
        const b = document.createElement("button"); b.textContent = vnOpt(txt);
        if (String(CFG[f.key]) === String(val)) b.classList.add("on");
        b.onclick = () => {
          let v = val;
          if (v === "true") v = true; else if (v === "false") v = false;
          CFG[f.key] = v; engine.patch(CFG);
          seg.querySelectorAll("button").forEach(x => x.classList.remove("on"));
          b.classList.add("on");
          pushHistory();
        };
        seg.appendChild(b);
      }
      target.appendChild(seg);
    } else if (f.t === "num") {
      numRow(target, f);
    } else if (f.t === "curve") {
      if (f.dur) numRow(target, f.dur);
      const cap = document.createElement("div"); cap.className = "cap"; cap.textContent = "Nhịp gia tốc";
      cap.title = "Nhịp tăng/giảm tốc của chuyển động — kéo 2 tay cầm để chỉnh đường cong";
      target.appendChild(cap);
      const s = document.createElement("select"); s.className = "sel";
      CURVES.forEach((c, i) => {
        const o = document.createElement("option");
        o.value = i; o.textContent = c.name;
        if (JSON.stringify(c.p) === JSON.stringify(CFG.curve)) o.selected = true;
        s.appendChild(o);
      });
      target.appendChild(s);
      const box = document.createElement("div"); box.className = "curve-box"; target.appendChild(box);
      const redraw = curveGraph(box, () => CFG.curve, (next) => { CFG.curve = next; engine.patch(CFG); }, () => pushHistory());
      s.onchange = () => { CFG.curve = CURVES[+s.value].p.slice(); engine.patch(CFG); redraw(); pushHistory(); };
    }
  };

  // bucket every field into a meaningful section, keep sections in this order
  const ORDER = ["Motion", "Layout", "Camera", "Style", "Timing"];
  const bucket = {};
  for (const f of preset.fields) {
    const name = f.t === "curve" ? "Timing" : GROUP_OF(f.key);
    (bucket[name] || (bucket[name] = [])).push(f);
  }
  for (const name of ORDER) {
    const fields = bucket[name];
    if (!fields || !fields.length) continue;
    const sec = document.createElement("div");
    sec.className = "sec" + (panelClosed.has(name) ? " closed" : "");
    const head = document.createElement("div");
    head.className = "sec-head";
    head.innerHTML = `<span class="chev">▼</span><span class="nm">${SECTION_LABEL[name]}</span><span class="eye">◉</span>`;
    head.onclick = () => {
      sec.classList.toggle("closed");
      sec.classList.contains("closed") ? panelClosed.add(name) : panelClosed.delete(name);
    };
    const body = document.createElement("div"); body.className = "sec-body";
    sec.append(head, body);
    left.appendChild(sec);
    for (const f of fields) renderField(f, body);
  }
  syncHistory();
  refreshCount();
}
const ALL_SECTIONS = ["Motion", "Layout", "Camera", "Style", "Timing"];
const PINNED_OPEN = "Timing";                 // this section stays open on load / motion switch
const collapseRest = () => ALL_SECTIONS.forEach(s => s === PINNED_OPEN ? panelClosed.delete(s) : panelClosed.add(s));

collapseRest();

    parallaxSpeedStep: "Chênh lệch tốc độ giữa các lớp gần / xa",
  };
  if (H[key]) return H[key];
  if (/(R|r)adius$/.test(key)) return "Bán kính — tăng thì hình to ra";
  if (/(G|g)ap$/.test(key)) return "Khoảng hở giữa các ảnh";
  if (/(D|d)epth$/.test(key)) return "Độ đẩy ảnh ra xa theo chiều sâu";
  if (/(H|h)eight$/.test(key)) return "Chiều cao / biên độ dao động";
  if (/(W|w)idth$/.test(key)) return "Chiều rộng vùng trải ảnh";
  if (/(A|a)ngle$/.test(key)) return "Góc nghiêng (độ)";
  if (/(S|s)cale$/.test(key) || /(B|b)ump$/.test(key)) return "Tỉ lệ phóng to / thu nhỏ (%)";
  if (/(T|t)urns$/.test(key) || /(W|w)aves$/.test(key)) return "Số vòng xoắn / số con sóng";
  if (/(S|s)pread$/.test(key)) return "Độ dàn trải rộng";
  if (/(F|f)an/.test(key)) return "Độ xòe / lệch của chồng ảnh";
  return "";
}

/* ---- images ---- */
const listEl = document.getElementById("list");
const fileEl = document.getElementById("file");

function importFiles(fileList) {
  const imgs = [...fileList]
    .filter(f => f.type.startsWith("image/"))
    .sort((a, b) => (a.webkitRelativePath || a.name).localeCompare(b.webkitRelativePath || b.name, undefined, { numeric: true }));
  if (!imgs.length) return;
  for (const f of imgs) images.push({ name: f.name.replace(/\.[^.]+$/, ""), url: URL.createObjectURL(f), on: true });
  sync(); renderList();
}

document.getElementById("add").onclick = () => fileEl.click();
fileEl.onchange = (e) => { importFiles(e.target.files); fileEl.value = ""; };
document.getElementById("wipe").onclick = () => { images = []; sync(); renderList(); };

// drag a folder (or files) onto the right panel
const rightCol = document.getElementById("right");
const readAll = (reader) => new Promise((res) => {
  const out = [];
  const step = () => reader.readEntries((b) => { if (!b.length) return res(out); out.push(...b); step(); }, () => res(out));
  step();
});
async function walkEntry(entry, bag) {
  if (entry.isFile) await new Promise((r) => entry.file((f) => { bag.push(f); r(); }, r));
  else if (entry.isDirectory) for (const e of await readAll(entry.createReader())) await walkEntry(e, bag);
}
rightCol.addEventListener("dragover", (e) => { e.preventDefault(); rightCol.classList.add("drop"); });
rightCol.addEventListener("dragleave", (e) => { if (e.target === rightCol) rightCol.classList.remove("drop"); });
rightCol.addEventListener("drop", async (e) => {
  e.preventDefault(); rightCol.classList.remove("drop");
  const flatFiles = [...(e.dataTransfer.files || [])];       // capture synchronously
  const entries = [];
  for (const it of e.dataTransfer.items || []) {
    const entry = it.webkitGetAsEntry && it.webkitGetAsEntry();
    if (entry) entries.push(entry);
  }
  const bag = [];
  for (const entry of entries) await walkEntry(entry, bag);
  importFiles(bag.length ? bag : flatFiles);
});

function sync() {
  engine.sources_(live());
}
const EYE = `<svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1.5 10S4.5 4 10 4s8.5 6 8.5 6-3 6-8.5 6-8.5-6-8.5-6Z"/><circle cx="10" cy="10" r="2.6"/></svg>`;
const EYE_OFF = `<svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1.5 10S4.5 4 10 4s8.5 6 8.5 6-3 6-8.5 6-8.5-6-8.5-6Z"/><circle cx="10" cy="10" r="2.6"/><path d="M3 3l14 14"/></svg>`;
function renderList() {
  refreshCount();
  listEl.innerHTML = "";
  images.forEach((im, i) => {
    const row = document.createElement("div");
    row.className = "tile" + (im.on ? "" : " hidden");
    row.innerHTML = `<img src="${im.url}" alt=""><div class="nm">${im.name}</div>
      <div class="acts">
        <button data-t title="Ẩn / hiện">${im.on ? EYE : EYE_OFF}</button>
        <button data-x title="Xoá">✕</button>
      </div>`;
    row.querySelector("[data-t]").onclick = () => { im.on = !im.on; sync(); renderList(); };
    row.querySelector("[data-x]").onclick = () => { images.splice(i, 1); sync(); renderList(); };
    listEl.appendChild(row);
  });
}

for (let s = 0; s <= SPAN; s += 2) {
  const m = document.createElement("div");
  m.className = "mk"; m.style.left = (s / SPAN * 100) + "%"; m.textContent = s + "s";
  scrub.appendChild(m);
}
pp.onclick = () => play();
const seek = (e) => {
  const r = scrub.getBoundingClientRect();
  setHead(clamp((e.clientX - r.left) / r.width, 0, 1) * SPAN);
};
scrub.addEventListener("pointerdown", (e) => { scrubbing = true; seek(e); });
addEventListener("pointermove", (e) => { if (scrubbing) seek(e); });
addEventListener("pointerup", () => { if (scrubbing) { scrubbing = false; anchor = performance.now() - head * 1000; } });

const menu = document.getElementById("menu");

menu.querySelectorAll("button").forEach(b => b.onclick = () => { menu.style.display = "none"; b.dataset.fmt === "png" ? savePNG() : saveWEBM(); });

function grab(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function savePNG() {
  engine.paint();
  engine.gl.domElement.toBlob((b) => b && grab(b, "moga.png"), "image/png");
}
function saveWEBM() {
  if (recording) return;
  const cand = ["video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"];
  const type = cand.find(t => MediaRecorder.isTypeSupported(t));
  if (!type) { alert("Trình duyệt này không quay được WebM."); return; }
  rec = new MediaRecorder(engine.gl.domElement.captureStream(30), { mimeType: type, videoBitsPerSecond: 12_000_000 });
  blobs = [];
  rec.ondataavailable = (e) => e.data.size && blobs.push(e.data);
  rec.onstop = () => { grab(new Blob(blobs, { type: "video/webm" }), "moga.webm"); document.getElementById("rec").style.display = "none"; };
  setHead(0); loopsSeen = 0; play(true);
  recording = true;
  document.getElementById("rec").style.display = "flex";
  rec.start();
}
function stopRec() { recording = false; try { rec.stop(); } catch {} }

play(true);
loop();
